<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bandeja de prospectos · Loren's Art</title>
  <meta name="theme-color" content="#17402F" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <header class="bar">
    <div class="wrap bar-row">
      <a class="logo" href="/" aria-label="Ir a la página pública">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="12" r="7" fill="#D6336C"/><circle cx="11" cy="10" r="4" fill="#F28AA8"/><path d="M16 19 V30" stroke="#2F6B4E" stroke-width="3" stroke-linecap="round"/><ellipse cx="21" cy="24" rx="5" ry="2.5" fill="#2F6B4E" transform="rotate(-25 21 24)"/></svg>
        <span>Loren's Art</span>
      </a>
      <span class="bar-title">Bandeja de prospectos</span>
      <button class="btn-ghost" id="logout" hidden>Cerrar sesión</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Acceso -->
    <section class="login" id="login-view" hidden>
      <h1>Entrar a la bandeja</h1>
      <p class="muted">Solo para el equipo de Loren's Art.</p>
      <form id="login-form" novalidate>
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button class="btn" type="submit" id="login-btn">Entrar</button>
        <p class="form-error" id="login-error" role="alert"></p>
      </form>
    </section>

    <!-- Bandeja -->
    <section id="inbox-view" hidden>
      <div class="inbox-head">
        <div>
          <h1>Prospectos por prioridad</h1>
          <p class="muted" id="updated">Ordenados automáticamente por score, del más caliente al más frío.</p>
        </div>
        <button class="btn-ghost" id="refresh">Actualizar</button>
      </div>

      <div class="summary" id="summary" aria-live="polite"></div>

      <div class="tabs" role="tablist" aria-label="Filtrar por estado">
        <button role="tab" class="tab" data-filter="Por contactar" aria-selected="true">Por contactar <span class="count" id="c-pend">0</span></button>
        <button role="tab" class="tab" data-filter="Contactado" aria-selected="false">Contactados <span class="count" id="c-done">0</span></button>
        <button role="tab" class="tab" data-filter="Todos" aria-selected="false">Todos <span class="count" id="c-all">0</span></button>
      </div>

      <ol class="leads" id="leads"></ol>
      <p class="empty" id="empty" hidden></p>
    </section>

    <p class="form-error" id="config-error" hidden></p>
  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
